<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingliz tili mashqlari</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1f2937;--mut:#6b7280;--pri:#58cc02;--prid:#46a302;--ok:#d7ffb8;--bad:#ffdfe0;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mut:#9ca3af;--ok:#14532d;--bad:#7f1d1d;--bd:#374151}}
:root[data-theme="dark"]{--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mut:#9ca3af;--ok:#14532d;--bad:#7f1d1d;--bd:#374151}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px}
.bar{height:12px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0 16px}
.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;text-align:center}
.tag{font-size:14px;color:var(--mut);margin-bottom:8px}
.big{font-size:84px;line-height:1.1;margin:8px 0}
.q{font-size:20px;margin:8px 0 16px}
.sent{font-size:24px;font-weight:600;margin:12px 0}
button,input{font:inherit;color:inherit}
button{min-height:52px;border-radius:12px;border:2px solid var(--bd);background:var(--card);padding:10px 16px;cursor:pointer;font-size:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.main{background:var(--pri);border-color:var(--prid);color:#fff;font-weight:700;width:100%;margin-top:12px}
.sec{width:100%;margin-top:10px;font-size:16px;color:var(--mut)}
input{width:100%;box-sizing:border-box;min-height:52px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);padding:8px 14px;font-size:20px;text-align:center}
.fb{margin-top:14px;padding:12px;border-radius:12px;font-size:18px;font-weight:600}
.fb.ok{background:var(--ok)}.fb.bad{background:var(--bad)}
.opt.ok{background:var(--ok);border-color:var(--prid)}.opt.bad{background:var(--bad)}
.msg{color:var(--mut);margin-top:10px;min-height:22px}
</style>
</head>
<body>
<main>
<div class="bar"><i id="pb"></i></div>
<div id="app"></div>
</main>
<script>
var W=[
["cat","mushuk","🐱","The ___ sleeps on the sofa."],["dog","it","🐶","The ___ runs in the park."],
["apple","olma","🍎","I eat a red ___."],["book","kitob","📚","I read a ___."],
["bread","non","🍞","I buy ___ at the shop."],["milk","sut","🥛","The cat drinks ___."],
["car","mashina","🚗","My father drives a ___."],["house","uy","🏠","I live in a big ___."],
["fish","baliq","🐟","The ___ swims in water."],["bird","qush","🐦","The ___ can fly."],
["banana","banan","🍌","A monkey likes a ___."],["sun","quyosh","☀️","The ___ is hot."],
["tree","daraxt","🌳","A bird sits on the ___."],["egg","tuxum","🥚","I eat an ___ for breakfast."],
["clock","soat","⏰","The ___ shows the time."],["phone","telefon","📱","I call my mom on the ___."],
["key","kalit","🔑","I open the door with a ___."],["star","yulduz","⭐","I see a ___ in the sky."],
["flower","gul","🌸","The ___ smells good."],["water","suv","💧","I drink ___ every day."]
];
var N=10,Q=[],i=0,score=0,answered=false,cur=null;
function shuf(a){a=a.slice();for(var j=a.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=a[j];a[j]=a[k];a[k]=t}return a}
function start(){
  var ws=shuf(W).slice(0,N),ty=shuf(["mcq","write","speak","blank","mcq","write","speak","blank","mcq","blank"]);
  Q=ws.map(function(w,n){return{w:w,t:ty[n]}});i=0;score=0;show();
}
function $(id){return document.getElementById(id)}
function show(){
  $("pb").style.width=(i/N*100)+"%";
  if(i>=N)return end();
  cur=Q[i];answered=false;var w=cur.w,h="";
  var head='<div class="tag">Savol '+(i+1)+' / '+N+'</div>';
  if(cur.t=="mcq"){
    var o=shuf([w[0]].concat(shuf(W.filter(function(x){return x[0]!=w[0]})).slice(0,3).map(function(x){return x[0]})));
    h=head+'<div class="q">Toʻgʻri javobni toping</div><div class="big">'+w[2]+'</div><div class="q"><b>'+w[1]+'</b> inglizcha qanday?</div><div class="opts">'+
      o.map(function(x){return '<button class="opt" data-v="'+x+'" onclick="pick(this)">'+x+'</button>'}).join("")+'</div>';
  }else if(cur.t=="write"){
    h=head+'<div class="q">Rasmga qarab nomini inglizcha yozing</div><div class="big">'+w[2]+'</div>'+inp();
  }else if(cur.t=="blank"){
    h=head+'<div class="q">Boʻsh joyga mos soʻzni yozing</div><div class="big">'+w[2]+'</div><div class="sent">'+w[3].replace("___","_____")+'</div><div class="tag">Maslahat: '+w[1]+'</div>'+inp();
  }else{
    h=head+'<div class="q">Rasmga qarab nomini inglizcha ayting</div><div class="big">'+w[2]+'</div>'+
      '<button class="main" onclick="listen()">🎤 Gapirish</button><button class="sec" onclick="skip()">Oʻtkazib yuborish</button>';
  }
  $("app").innerHTML='<div class="card">'+h+'<div class="msg" id="msg"></div><div id="fb"></div></div>';
  var f=$("ans");if(f){f.focus();f.addEventListener("keydown",function(e){if(e.key=="Enter")check()})}
}
function inp(){return '<input id="ans" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Javobni yozing"><button class="main" onclick="check()">Tekshirish</button>'}
function norm(s){return s.toLowerCase().trim().replace(/\s+/g," ")}
function pick(b){
  if(answered)return;var ok=b.dataset.v==cur.w[0];
  document.querySelectorAll(".opt").forEach(function(x){if(x.dataset.v==cur.w[0])x.classList.add("ok")});
  if(!ok)b.classList.add("bad");done(ok);
}
function check(){var f=$("ans");if(answered||!f||!f.value.trim())return;done(norm(f.value)==cur.w[0])}
function done(ok){
  if(answered)return;answered=true;if(ok)score++;
  var f=$("ans");if(f)f.disabled=true;
  $("fb").innerHTML='<div class="fb '+(ok?"ok":"bad")+'">'+(ok?"✅ Toʻgʻri!":"❌ Xato. Toʻgʻri javob: "+cur.w[0])+'</div><button class="main" onclick="next()">Keyingisi ➡️</button>';
  say(cur.w[0]);
}
function next(){i++;show()}
function skip(){if(answered)return;answered=true;$("fb").innerHTML='<div class="fb bad">Javob: '+cur.w[0]+'</div><button class="main" onclick="next()">Keyingisi ➡️</button>';say(cur.w[0])}
function say(t){try{var u=new SpeechSynthesisUtterance(t);u.lang="en-US";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function listen(){
  if(answered)return;
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$("msg").textContent="Bu brauzerda mikrofon ishlamaydi. Oʻtkazib yuboring yoki Chrome’da oching.";return}
  var r=new SR();r.lang="en-US";r.maxAlternatives=5;
  r.onresult=function(e){
    var alts=[].map.call(e.results[0],function(a){return a.transcript.toLowerCase()});
    done(alts.some(function(t){return t.split(/\s+/).indexOf(cur.w[0])>-1}));
  };
  r.onerror=function(e){$("msg").textContent="Mikrofon ishlamadi ("+e.error+"). Ruxsat bering yoki oʻtkazib yuboring."};
  r.onend=function(){if(!answered&&$("msg")&&$("msg").textContent.indexOf("Eshitaman")==0)$("msg").textContent="Ovoz eshitilmadi. Qayta urinib koʻring."};
  try{r.start();$("msg").textContent="Eshitaman… gapiring 🎤"}catch(x){}
}
function end(){
  $("pb").style.width="100%";
  var m=score>=9?"Ajoyib! 🏆":score>=7?"Juda yaxshi! 🎉":score>=5?"Yomon emas, davom eting! 💪":"Yana mashq qiling, uddalaysiz! 📚";
  $("app").innerHTML='<div class="card"><div class="big">'+(score>=7?"🌟":"📘")+'</div><div class="q">Natija: <b>'+score+' / '+N+'</b></div><div class="q">'+m+'</div><button class="main" onclick="start()">🔄 Qaytadan boshlash</button></div>';
}
start();
</script>
</body>
</html>
